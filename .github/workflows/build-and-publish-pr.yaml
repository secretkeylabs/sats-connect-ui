name: Build and Publish NPM package

on:
  pull_request:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout@v4

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e #v4.3.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - id: current-version
        name: Get current version
        run: echo "CURRENT_VERSION=$(npm pkg get version  | tr -d '"')" >> $GITHUB_OUTPUT

      - id: sha
        name: Get commit sha
        run: echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set publish version
        run: npm version --no-git-tag-version $CURRENT_VERSION-$SHA
        env:
          SHA: ${{ steps.sha.outputs.SHA }}
          CURRENT_VERSION: ${{ steps.current-version.outputs.CURRENT_VERSION }}

      # Authenticates via GitHub OIDC (trusted publishing), no npm token needed.
      # Do not set registry-url on setup-node: it injects a placeholder NODE_AUTH_TOKEN which disables OIDC.
      - name: Publish to NPM package registry
        run: npm publish --access=public --tag pr-$PR_NUMBER
        env:
          PR_NUMBER: ${{ github.event.number }}
